<svg xmlns="http://www.w3.org/2000/svg" width="420" height="214" viewBox="0 0 420 214" role="img" aria-label="ngquangtrung57 GitHub stats, grade A">
<style>
  text { font: 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24292f; }
  .card { fill: #ffffff; stroke: #d0d7de; }
  .title { font-size: 17px; font-weight: 600; fill: #0969da; }
  .lbl { fill: #57606a; }
  .val { font-weight: 600; }
  .grade { font-size: 26px; font-weight: 700; }
  .ring { fill: none; stroke: #d0d7de; stroke-width: 6; }
  .arc { fill: none; stroke: #0969da; stroke-width: 6; stroke-linecap: round; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .card { fill: #0d1117; stroke: #30363d; }
    .title { fill: #58a6ff; }
    .lbl { fill: #8b949e; }
    .ring { stroke: #30363d; }
    .arc { stroke: #58a6ff; }
  }
</style>
<rect class="card" x="0.5" y="0.5" width="419" height="213" rx="6"/>
<text class="title" x="25" y="35">ngquangtrung57's GitHub Stats</text>
<g transform="translate(25,60)"><text class="lbl">Total stars (contributed repos)</text><text class="val" x="215">10.5k</text></g>
<g transform="translate(25,84)"><text class="lbl">Commits</text><text class="val" x="215">2.5k</text></g>
<g transform="translate(25,108)"><text class="lbl">Pull requests</text><text class="val" x="215">76</text></g>
<g transform="translate(25,132)"><text class="lbl">PR reviews</text><text class="val" x="215">28</text></g>
<g transform="translate(25,156)"><text class="lbl">Issues</text><text class="val" x="215">2</text></g>
<g transform="translate(25,180)"><text class="lbl">Contributed to</text><text class="val" x="215">25</text></g>
<g transform="translate(340,107)">
  <circle class="ring" r="40"/>
  <circle class="arc" r="40"
          stroke-dasharray="196.8 251.3" transform="rotate(-90)"/>
  <text class="grade" text-anchor="middle" dominant-baseline="central">A</text>
</g>
</svg>
