name: Stats card

on:
  schedule:
    - cron: "17 3 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats.svg
        run: python3 scripts/stats_card.py
        env:
          # Optional secret STATS_TOKEN (classic PAT, no scopes needed) avoids GITHUB_TOKEN limits.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || (git commit -m "Update stats card" && git push)
